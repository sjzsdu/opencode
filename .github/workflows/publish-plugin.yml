name: publish-plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.3.14, defaults to package.json version)"
        required: false
        type: string
      dry_run:
        description: "Dry run (skip real publish)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "sjz-plugin-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" =~ ^sjz-plugin-v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION=$(node -p "require('./packages/plugin/package.json').version")
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish sjz-opencode-plugin
        run: bun ./script/publish.ts
        working-directory: packages/plugin
        env:
          VERSION: ${{ steps.version.outputs.value }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
