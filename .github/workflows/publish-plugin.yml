name: publish-plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.2.24.1)"
        required: true
        type: string
  push:
    tags:
      - "plugin-v*"
    paths:
      - packages/plugin/**

jobs:
  publish-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      - name: Set version from input
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd packages/plugin
          npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Build plugin
        run: bun run --filter @opencode-ai/plugin build

      - name: Publish to npm
        run: bun run --filter @opencode-ai/plugin publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
